name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: Only show the new version, do not commit
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bump
        id: v
        run: |
          OLD=$(node -p "require('./package.json').version")
          npm version ${{ inputs.bump }} --no-git-tag-version
          node tools/sync-version.js
          NEW=$(node -p "require('./package.json').version")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "### Version: $OLD → $NEW" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json appinfo.json
          git commit -m "chore: bump version to ${{ steps.v.outputs.new }}"
          git push
