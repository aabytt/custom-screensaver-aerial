# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build & Release

on:
  push:
    branches:
      - '!*'
    tags:
      - 'v*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Use Node.js 14.x
      uses: actions/setup-node@v1
      with:
        node-version: 14.x

    - run: npm ci
    - run: npm run build -- --production
    - run: npm run package
    - run: echo RELEASE_FILENAME_IPK=`ls *.ipk` >> $GITHUB_ENV
    - run: npm run manifest

    - name: Generate release notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${GITHUB_REF_NAME}"
        PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
        echo "PREV_TAG=${PREV}" >> $GITHUB_ENV
        if [ -n "$PREV" ]; then
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f previous_tag_name="$PREV" --jq .body > notes.md
        else
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md
        fi

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body_path: notes.md
        draft: false
        prerelease: true

    - name: Upload IPK asset
      id: upload-ipk-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: ${{github.workspace}}/${{env.RELEASE_FILENAME_IPK}}
        asset_name: ${{env.RELEASE_FILENAME_IPK}}
        asset_content_type: application/vnd.debian.binary-package

    - name: Upload Manifest asset
      id: upload-manifest-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: ${{github.workspace}}/org.aabytt.webos.custom-screensaver-aerial.manifest.json
        asset_name: org.aabytt.webos.custom-screensaver-aerial.manifest.json
        asset_content_type: application/json

    - name: Update CHANGELOG.md
      run: |
        TAG="${GITHUB_REF_NAME}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git checkout -B main origin/main
        {
          echo "## [${TAG#v}] - $(date -u +%F)"
          echo
          sed 's/^## /### /' notes.md | cat -s
          echo
        } > section.md
        awk 'FNR==NR{s=s $0 "\n"; next} !d && /^## \[/ {printf "%s", s; d=1} {print}' section.md CHANGELOG.md > CHANGELOG.new
        mv CHANGELOG.new CHANGELOG.md
        if [ -n "$PREV_TAG" ]; then
          echo "[${TAG#v}]: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" >> CHANGELOG.md
        fi
        git add CHANGELOG.md
        git commit -m "docs: changelog for ${TAG}"
        git push origin main
