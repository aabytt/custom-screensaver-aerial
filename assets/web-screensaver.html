<!doctype html>
<!--
  Aerial screensaver for webOS versions where the stock screensaver is a Flutter app
  (webOS 25 / 10.x) and QML apps can't be launched. apply.sh bind-mounts the assets directory
  over /usr/palm/applications/com.webos.app.screensaver (see assets/appinfo.json). Web apps
  can only read files inside their own app directory, so everything is loaded relative to it.
  Mirrors screensaver-main.qml and reads the same settings, videos and locales.

  A paused video in another app keeps its hardware decoder. If Aerial asks
  for the same decoder, the media server takes it away and that app can't resume. So if
  another app holds a video decoder, this shows only the time and date instead of video.
-->
<html>
<head>
<meta charset="utf-8">
<title>Aerial</title>
<style>
  @font-face { font-family: SegoeUILight; src: url("fonts/SegoeUI-Light.ttf"); }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  /* 1px short of fullscreen: webOS ends the screensaver when fullscreen video plays */
  video { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 1px); object-fit: cover;
          opacity: 0; transition: opacity 3s ease; }
  video.on { opacity: 1; }
  video.fading { opacity: 0; transition-duration: 5s; }
  /* The OSD box (65 px margins). Its four lines are placed by layoutOSD() from settings.osd,
     with the same numbers as the preview in the app's Display panel */
  #osd { position: absolute; left: 65px; right: 65px; top: 65px; bottom: 65px; color: #fff;
         font-family: SegoeUILight, sans-serif; letter-spacing: -1px;
         opacity: 0; transition: opacity 3s ease; }
  #osd.fading { transition-duration: 5s; }
  /* Panel protection, drift: the box moves 1 px at a time, smoothly */
  body.drift #osd { transition-property: opacity, transform; transition-duration: 3s, 1s; transition-timing-function: ease, linear; }
  body.drift #osd.fading { transition-duration: 5s, 1s; }
  #osd .ln { position: absolute; white-space: nowrap; line-height: 1.33; text-shadow: var(--osd-shadow, 0 1px 0 #000);
             transition: opacity var(--od, 1.5s) ease, filter 1.5s ease; }   /* opacity: auto fade out; filter: corner hop */
  /* Clock mode: only the time and date, moved every minute against OLED burn-in */
  body.clock #osd { right: auto; bottom: auto; text-align: right; }
  body.clock #osd .ln { position: static; }
  body.clock #name, body.clock #poi { display: none !important; }
  #debug { position: absolute; top: 25px; right: 25px; color: #fff; font: 26px monospace;
           white-space: pre; text-align: right; display: none; }
</style>
</head>
<body>
<video id="video" muted autoplay></video>
<div id="osd">
  <div id="name" class="ln"></div>
  <div id="poi" class="ln"></div>
  <div id="time" class="ln"></div>
  <div id="date" class="ln"></div>
</div>
<div id="debug"></div>
<script src="solar.js"></script>
<script>
var basePath = "";
var settings = { localeLang: "en-GB", sourceType: "url-4K-SDR", osdOpacity: 60, debug: false, playLowerQuality: true };
var playList = { assets: [] };
var poi = { strings: {} };
var randomIndex = -1;
var nightPlaying = false; // the video playing now is from the night playlist
var solarPlaying = "";    // solar mode: the timeOfDay tag the video playing now was picked for
var disabledSet = null;
var sourceAlt = "";
var sourceKey = "";   // the source type actually chosen for the current video (url-4K-HDR, ...)
var stalledSeconds = 0;
var clockMode = false;
var clockTimers = [];

// ---- Panel protection (settings.protection, written by the app's "Panel protection" panel) ----
// Defaults must stay equal to DEFAULTS in ProtectionPanel.js. Brightness is the picture "backlight" (0-100).
// Protection of the text: any of "corners", "drift", "fade" joined with "+" (they work together). It takes priority over the position / opacity of the On-screen display panel. In clock mode the clock
// has its own moving: only the drift applies there.
var PTXT = { mode: "", corners: [], idx: 0, pa: null, ca: null, g: null };   // g: auto fade out state of [name + description, clock + date]
var PROT = { elapsed: 0, orig: -1, base: -1, last: -1, panelOff: false, standbyDone: false };
// luna method (under com.webos.service.tvpower/power/) that puts the TV in standby; "" = not known yet, nothing is called
var STANDBY_METHOD = "powerOff";

var video = document.getElementById("video");
var osd = document.getElementById("osd");

// ---- settings.osd (written by the app's Display panel) ----
// Defaults must stay equal to DEFAULTS in DisplayPanel.js / screensaver-main.qml
var OSD_DEFAULTS = {
    title: true, poi: true, clock: true, date: true,
    placeAnchor: "bl", placeScale: 100, clockAnchor: "br", clockScale: 100,
    seconds: true, clock24: true, font: "segoe", bold: false, shadow: false
};
var OSD_FONTS = {   // file relative to this page, letter spacing in px
    segoe: { file: "fonts/SegoeUI-Light.ttf", boldFile: "fonts/SegoeUI-Bold.ttf", spacing: -1 },
    roboto: { file: "fonts/Roboto-Light.ttf", boldFile: "fonts/Roboto-Bold.ttf", spacing: 0 },
    opensans: { file: "fonts/OpenSans-Light.ttf", boldFile: "fonts/OpenSans-Bold.ttf", spacing: 0 },
    montserrat: { file: "fonts/Montserrat-Light.ttf", boldFile: "fonts/Montserrat-Bold.ttf", spacing: 0 },
    oswald: { file: "fonts/Oswald-Light.ttf", boldFile: "fonts/Oswald-Bold.ttf", spacing: 0 },
    comfortaa: { file: "fonts/Comfortaa-Light.ttf", boldFile: "fonts/Comfortaa-Bold.ttf", spacing: 0 },
    lora: { file: "fonts/Lora-Regular.ttf", boldFile: "fonts/Lora-Bold.ttf", spacing: 0 },
    satisfy: { file: "fonts/Satisfy-Regular.ttf", spacing: 0 }
};
var OSD_ANCHORS = { tl: 1, tc: 1, tr: 1, bl: 1, bc: 1, br: 1 };

function osdGet(key) {
    var o = settings.osd, v = (o && typeof o === "object" && o[key] !== undefined) ? o[key] : OSD_DEFAULTS[key];
    if ((key === "placeAnchor" || key === "clockAnchor") && !OSD_ANCHORS[v]) v = OSD_DEFAULTS[key];
    if ((key === "placeScale" || key === "clockScale") && !(v > 0)) v = OSD_DEFAULTS[key];
    if (key === "font") {
        // "custom:<file name>": a font added in the app, in fonts/custom/ (see font-server.js)
        if (!OSD_FONTS[v] && typeof v === "string" && /^custom:[A-Za-z0-9._-]+$/.test(v)) {
            OSD_FONTS[v] = { file: "fonts/custom/" + v.slice(7), spacing: 0 };
        }
        if (!OSD_FONTS[v]) v = OSD_DEFAULTS.font;
    }
    return v;
}

// Opacity in % for a kind of source ("dv" | "sdr"). Without the split switch one value (osdOpacity)
// is used for everything; with it, Dolby Vision / HDR sources use osdOpacityDv (SDR if it is missing).
function osdOpacityOf(kind) {
    var sdr = settings.osdOpacity !== undefined ? settings.osdOpacity : 100;
    return (settings.osdOpacitySplit && kind === "dv" && settings.osdOpacityDv !== undefined) ? settings.osdOpacityDv : sdr;
}
function osdOpacityNow() {
    // clock mode shows no video: the SDR value
    var dv = !clockMode && /HDR/i.test(sourceKey);
    return osdOpacityOf(dv ? "dv" : "sdr") / 100;
}
// nothing to show at all (every opacity that can apply is 0)
function osdInvisible() {
    return osdOpacityOf("sdr") == 0 && (!settings.osdOpacitySplit || osdOpacityOf("dv") == 0);
}

// The real bold face is a font family of its own (OsdFontB-<id>) placed before the light one, so no weight matching is involved
function setOsdBold(bold, real, id) {
    osd.style.fontWeight = "normal";
    osd.style.webkitTextStroke = (bold && !real) ? "0.035em #fff" : "";
    // Segoe UI Light is declared in the CSS above (family SegoeUILight), the other fonts are declared in applyOsdFont()
    osd.style.fontFamily = ((bold && real) ? "'OsdFontB-" + id + "', " : "") + (id === "segoe" ? "" : "'OsdFont-" + id + "', ") +
        "SegoeUILight, 'Segoe UI', sans-serif";
}

// Loads only the chosen font (the page is in the app directory, so the file is relative)
function applyOsdFont() {
    var id = osdGet("font"), f = OSD_FONTS[id], st;
    st = document.createElement("style");   // Segoe UI Light itself is declared above already
    st.textContent = (id !== "segoe" ? "@font-face { font-family: 'OsdFont-" + id + "'; font-weight: normal; src: url('" + basePath + f.file + "'); }" : "") +
        (f.boldFile ? "@font-face { font-family: 'OsdFontB-" + id + "'; font-weight: normal; src: url('" + basePath + f.boldFile + "'); }" : "");
    document.head.appendChild(st);
    osd.style.letterSpacing = f.spacing + "px";
    // bold: the real bold face if the font has one, otherwise a thin outline in the text color
    setOsdBold(osdGet("bold"), !!f.boldFile, id);
    if (osdGet("bold") && f.boldFile && window.FontFace) {   // the file missing / rejected: the outline instead
        try {
            new FontFace("OsdBoldCheck", "url('" + basePath + f.boldFile + "')").load().then(null, function () { setOsdBold(true, false, id); });
        } catch (e) { setOsdBold(true, false, id); }
    }
    // soft shadow for bright scenes; the same value as SHADOW_ON in DisplayPanel.js
    osd.style.setProperty("--osd-shadow", osdGet("shadow") ? "0 2px 8px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8)" : "0 1px 0 #000");
}

// One line of the OSD in its place (same numbers as the preview / QML)
function putLine(el, on, anchor, y, px) {
    var col = anchor.charAt(1), t = (col === "c" && !clockMode) ? "translateX(-50%)" : "";
    el.style.display = on ? "" : "none";
    el.style.fontSize = px + "px";
    if (clockMode) {   // flows in the shrink-wrapped box
        el.style.top = el.style.left = el.style.right = "";
    } else {
        el.style.top = y + "px";
        el.style.left = col === "l" ? "0" : (col === "c" ? "50%" : "");
        el.style.right = col === "r" ? "0" : "";
    }
    el.style.webkitTransform = el.style.transform = t;
}

function layoutOSD() {
    var titleOn = !!osdGet("title"), poiOn = !!osdGet("poi"), clockOn = !!osdGet("clock"), dateOn = !!osdGet("date"),
        ps = osdGet("placeScale") / 100, cs = osdGet("clockScale") / 100,
        pa = PTXT.pa || osdGet("placeAnchor"), ca = PTXT.ca || osdGet("clockAnchor"),
        boxH = window.innerHeight - 130,
        pH = (titleOn && poiOn ? 106 : (titleOn ? 56 : (poiOn ? 40 : 0))) * ps,
        cH = (clockOn && dateOn ? 136 : (clockOn ? 79 : (dateOn ? 40 : 0))) * cs;
    function blockY(anchor, h) { return anchor.charAt(0) === "t" ? 0 : boxH * 0.9 + 106 - h; }
    var py = blockY(pa, pH), cy = blockY(ca, cH);
    putLine(document.getElementById("name"), titleOn, pa, py, 56 * ps);
    putLine(document.getElementById("poi"), poiOn, pa, py + (titleOn ? 66 * ps : 0), 40 * ps);
    putLine(document.getElementById("time"), clockOn, ca, cy, 79 * cs);
    putLine(document.getElementById("date"), dateOn, ca, cy + (clockOn ? 96 * cs : 0), 40 * cs);
}

function loadJSONData(url) {
    return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url);
        xhr.onload = function () {
            // file:// requests report status 0 on success
            if (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) {
                try {
                    resolve(JSON.parse(xhr.responseText));
                } catch (e) {
                    reject(new Error(url + ": " + e.message));
                }
            } else {
                reject(new Error(url + ": " + xhr.status));
            }
        };
        xhr.onerror = function () { reject(new Error(url + ": request failed")); };
        xhr.send();
    });
}

// sylvan.apple.com is signed by Apple's private root CA, which webOS doesn't trust
function fixUrl(url) {
    return url.replace(/^https:\/\/sylvan\.apple\.com\//, "http://sylvan.apple.com/");
}

// Any system toast ends the screensaver, and the TV shows one ("Dolby Vision") when an HDR video
// starts (#46). Like screensaver-main.qml: notifications are off while a video starts, and back on
// after 2 s of video, on an error and on exit. A toast sent meanwhile is dropped, not shown later.
// A disable outlives this page and survives a Quick Start power-off, so videoads-flag.sh (started
// by apply.sh) switches them on whenever the screensaver isn't running. It writes the time into
// watcher.json here at every check; without a recent one (no watcher, e.g. after an update without
// Apply) this page leaves notifications alone, as nothing would switch them back on.
var notifyCtl = typeof PalmServiceBridge !== "undefined";
var notifyOff = false;
var watcherAlive = false;
var watcherOrig = null;   // the user's brightness, kept by the watcher (Panel protection); null = unknown
var WATCHER_STALE = 60; // seconds: a check can take a while when services are slow
var closing = false;    // a key was pressed: no more disables or videos
function checkWatcher() {
    if (!notifyCtl) return Promise.resolve();
    return loadJSONData(basePath + "watcher.json")
        .then(function (w) {
            watcherAlive = Math.abs(Date.now() / 1000 - w.time) < WATCHER_STALE;
            watcherOrig = (watcherAlive && typeof w.orig === "number") ? w.orig : null;
        })
        .catch(function () { watcherAlive = false; watcherOrig = null; });
}
// done (optional) runs once the call is answered (or after 3 s), or at once if nothing was sent.
// force sends a disable even if one was sent already.
function setNotifications(on, force, done) {
    if (!notifyCtl || (notifyOff === !on && !force) || (!on && (closing || !watcherAlive))) {
        if (done) done();
        return;
    }
    notifyOff = !on;
    luna("luna://com.webos.notification/" + (on ? "enable" : "disable")).then(done);
}

// Same fallbacks as screensaver-main.qml
function pickSource(asset) {
    var key = pickSourceKey(asset);
    if (key) sourceKey = key;
    return key ? asset[key] : null;
}

function pickSourceKey(asset) {
    if (asset[settings.sourceType]) {
        sourceAlt = "";
        return settings.sourceType;
    }
    if (!settings.playLowerQuality) return null;
    if (settings.sourceType == "url-4K-HDR" && asset["url-4K-SDR"]) {
        sourceAlt = " - n/a, trying url-4K-SDR";
        return "url-4K-SDR";
    }
    if (settings.sourceType == "url-1080-HDR") {
        if (asset["url-1080-SDR"]) {
            sourceAlt = " - n/a, trying url-1080-SDR";
            return "url-1080-SDR";
        }
        if (asset["url-1080-H264"]) {
            sourceAlt = " - n/a, trying url-1080-H264";
            return "url-1080-H264";
        }
    }
    return null;
}

// Videos switched off in the app's "Choose videos" screen (empty selection = play all)
function isAllowed(asset) {
    return !disabledSet || !disabledSet[asset.id];
}

function buildDisabledSet() {
    disabledSet = null;
    var list = settings.disabledVideos || [];
    if (!list.length) return;
    var set = {}, enabled = 0;
    for (var i = 0; i < list.length; i++) set[list[i]] = true;
    for (var j = 0; j < playList.assets.length; j++) {
        if (!set[playList.assets[j].id]) enabled++;
    }
    if (enabled) disabledSet = set;
}

// Night mode: during the night hours (TV time, from nightStart up to nightEnd, which may be past
// midnight) videos come from the night playlist instead. Without a night video that can play with
// the chosen source, the normal playlist plays.
var nightSet = null;
function buildNightSet() {
    nightSet = null;
    var list = settings.nightVideos;
    if (!settings.nightMode || !Array.isArray(list) || !list.length) return;
    nightSet = {};
    for (var i = 0; i < list.length; i++) nightSet[list[i]] = true;
}

function nightHours(date) {
    var start = parseInt(settings.nightStart, 10), end = parseInt(settings.nightEnd, 10), h = date.getHours();
    if (isNaN(start) || isNaN(end) || start === end) return false;
    return start < end ? h >= start && h < end : h >= start || h < end;
}

// ---- Solar mode: the videos' timeOfDay tags (sunrise / day / sunset / night) follow the sun at the
// chosen city (settings.solarCity). The times come from solar.json, which solar-update.sh keeps
// (boot + about once a day); if that is missing, for another place or run out, they are calculated
// (solar.js), which is accurate to a couple of minutes.
var solarData = null;
function loadSolar() {
    return loadJSONData(basePath + "solar.json")
        .then(function (d) { solarData = d; })
        .catch(function () { solarData = null; });
}

function solarCityOk() {
    var c = settings.solarCity;
    return !!(settings.solarMode && c && isFinite(Number(c.lat)) && isFinite(Number(c.lon)));
}

// "sunrise" | "day" | "sunset" | "night", or null when solar mode is off
var solarSource = "";
function solarPhase() {
    if (!solarCityOk() || typeof solarTimeOfDay !== "function") return null;
    var lat = Number(settings.solarCity.lat), lon = Number(settings.solarCity.lon),
        win = settings.solarWindow !== undefined ? Number(settings.solarWindow) : 60,
        now = Date.now(), d = solarData, phase = null;
    if (d && Math.abs(Number(d.lat) - lat) < 0.001 && Math.abs(Number(d.lon) - lon) < 0.001 &&
        d.sunrise && d.sunset && d.sunrise.length && d.sunset.length) {
        var r = [], s = [], i, before = false, after = false;
        for (i = 0; i < d.sunrise.length; i++) r.push(d.sunrise[i] * 1000);
        for (i = 0; i < d.sunset.length; i++) s.push(d.sunset[i] * 1000);
        // the stored days must surround now (at least one event on each side), else they ran out
        for (i = 0; i < r.length; i++) { if (r[i] <= now) before = true; else after = true; }
        for (i = 0; i < s.length; i++) { if (s[i] <= now) before = true; else after = true; }
        if (before && after) {
            phase = solarPhaseFromEvents(now, r, s, win);
            solarSource = "stored";
        }
    }
    if (!phase) {
        phase = solarTimeOfDay(lat, lon, now, win);
        solarSource = "calculated";
    }
    return phase;
}

// The pool a video is picked from: false = the normal playlist, true = the night playlist (night
// mode), or a timeOfDay tag in solar mode (the normal playlist, only videos with that tag).
function inPool(asset, pool) {
    if (typeof pool === "string") return isAllowed(asset) && asset.timeOfDay === pool;
    return pool ? !!nightSet[asset.id] : isAllowed(asset);
}

// The pool for the next video (playRandomVideo falls back when none of its videos can play)
var solarNow = "";
function poolNow() {
    var phase = solarPhase();
    solarNow = phase || "";
    if (phase) return phase;
    return !!nightSet && nightHours(new Date());
}

// Videos of the night or the normal playlist to pick the next one from. again: the video now
// playing may be picked again, if it's the only one (not after it failed to play)
function candidatesFor(night, again) {
    var assets = playList.assets;
    var candidates = [];
    for (var i = 0; i < assets.length; i++) {
        if (!assets[i].viewed && i !== randomIndex && inPool(assets[i], night) && pickSource(assets[i])) candidates.push(i);
    }
    if (!candidates.length) {
        // Everything has been shown once: start over
        for (var j = 0; j < assets.length; j++) {
            if (inPool(assets[j], night)) assets[j].viewed = false;
        }
        for (var k = 0; k < assets.length; k++) {
            if (k !== randomIndex && inPool(assets[k], night) && pickSource(assets[k])) candidates.push(k);
        }
        // A playlist of one video: play it again
        if (!candidates.length && again && randomIndex >= 0 && inPool(assets[randomIndex], night) && pickSource(assets[randomIndex])) {
            candidates.push(randomIndex);
        }
    }
    return candidates;
}

// afterError: true when the video before failed to play
function playRandomVideo(afterError) {
    if (PROT.panelOff) return;
    if (closing) return;
    var assets = playList.assets;
    var again = afterError !== true;
    var night = poolNow();
    var candidates = candidatesFor(night, again);
    if (!candidates.length && night) {
        // no night video can play with the chosen source, or the only one failed: the normal
        // playlist instead. Solar mode: sunrise and sunset fall back to the day videos first.
        if (night === "sunrise" || night === "sunset") {
            night = "day";
            candidates = candidatesFor(night, again);
        }
        if (!candidates.length) {
            night = false;
            candidates = candidatesFor(false, again);
        }
    }
    nightPlaying = night === true;
    solarPlaying = typeof night === "string" ? night : "";
    if (!candidates.length) return;
    randomIndex = candidates[Math.floor(Math.random() * candidates.length)];
    stalledSeconds = 0;
    video.classList.remove("on", "fading");
    osd.classList.remove("fading");
    osd.style.opacity = 0;
    document.getElementById("name").textContent = poi.strings[assets[randomIndex].localizedNameKey] || "";
    document.getElementById("poi").textContent = "";
    setNotifications(false);
    video.src = fixUrl(pickSource(assets[randomIndex]));
    video.play().catch(function () {});
}

video.addEventListener("playing", function () {
    // Again as the video starts: the watcher may have switched them on while the screensaver
    // was starting, before tvpowerd reported it
    if (video.currentTime <= 2) setNotifications(false, true);
    video.classList.add("on");
    osd.style.opacity = osdOpacityNow();
    protOnPlaying();
});
video.addEventListener("ended", playRandomVideo);
video.addEventListener("error", function () {
    setNotifications(true);
    setTimeout(function () { playRandomVideo(true); }, 1000);
});

function checkStatus() {
    if (randomIndex < 0) return;
    var asset = playList.assets[randomIndex];
    if (video.currentTime > 2) {
        asset.viewed = true;
        setNotifications(true);
    }
    if (video.duration && Math.floor(video.currentTime) == Math.floor(video.duration) - 5) {
        video.classList.add("fading");
        osd.classList.add("fading");
        osd.style.opacity = 0;
    }
    if (video.paused || video.readyState < 3) {
        if (++stalledSeconds > 25) playRandomVideo();
    } else {
        stalledSeconds = 0;
    }
    var poiKey = (asset.pointsOfInterest || {})[Math.floor(video.currentTime)];
    if (poiKey && poi.strings[poiKey]) {
        var poiEl = document.getElementById("poi");
        if (poiEl.textContent !== poi.strings[poiKey]) {
            poiEl.textContent = poi.strings[poiKey];
            protPoiChanged();
        }
    }
}

function updateOSD() {
    var now = new Date(), lang = settings.localeLang, d = poi.date,
        seconds = !!osdGet("seconds"), h24 = !!osdGet("clock24"), time, date, h;
    function two(n) { return (n < 10 ? "0" : "") + n; }
    try {
        time = now.toLocaleTimeString(lang, { hour: h24 ? "2-digit" : "numeric", minute: "2-digit",
            second: seconds ? "2-digit" : undefined, hour12: !h24 });
    } catch (e) {
        h = now.getHours();
        time = h24 ? two(h) : String(h % 12 || 12);
        time += ":" + two(now.getMinutes()) + (seconds ? ":" + two(now.getSeconds()) : "") + (h24 ? "" : (h < 12 ? " AM" : " PM"));
    }
    document.getElementById("time").textContent = time;
    if (d) {
        date = d.daysOfWeek[now.getDay()] + ", " + now.getDate() + " " + d.months[now.getMonth()];
    } else {
        date = now.toLocaleDateString(lang, { weekday: "long", day: "numeric", month: "long" });
    }
    document.getElementById("date").textContent = date;
}

// Calls a luna method. Resolves to the parsed reply, or to null if there is none within 3 s or the
// call fails: it never rejects, so it can't stop the video or the exit.
var bridges = {}; // one per method, kept: a garbage-collected PalmServiceBridge drops its call
function luna(uri, params) {
    return new Promise(function (resolve) {
        if (typeof PalmServiceBridge === "undefined") return resolve(null);
        setTimeout(function () { resolve(null); }, 3000);
        try {
            var bridge = bridges[uri] = new PalmServiceBridge();
            bridge.onservicecallback = function (msg) {
                try { resolve(JSON.parse(msg)); } catch (e) { resolve(null); }
            };
            bridge.call(uri, JSON.stringify(params || {}));
        } catch (e) {
            console.error(uri + ": " + e.message);
            resolve(null);
        }
    });
}

// Resolves to true if another app holds a video decoder. Live TV (type "tv") is skipped: LG
// Channels and the home screen leave it running in the background with decoders reserved (#62),
// and the screensaver's video plays next to it.
function videoDecoderInUse() {
    return luna("luna://com.webos.media/getActivePipelines").then(function (pipelines) {
        return Array.isArray(pipelines) && pipelines.some(function (pipeline) {
            return pipeline.type !== "tv" && (pipeline.resource || []).some(function (r) {
                return /VDEC|HEVC|H264|MSVC|VP9|AV1/.test(r.resource);
            });
        });
    });
}

// screenmanager ends the screensaver when it sees fullscreen video, except for apps in manual
// screensaver mode (and LG's videoads). webOS 26 does so within a second, despite the 1px trick.
// The mode is kept in screenmanager's memory until it restarts, so it's set at every start.
function setManualMode() {
    return luna("luna://com.webos.service.screenmanager/setScreenSaverMode",
        { appId: "com.webos.app.screensaver", mode: "manual" });
}

function moveClock() {
    osd.style.opacity = 0;
    setTimeout(function () {
        if (!clockMode) return;
        osd.style.left = Math.random() * (window.innerWidth - osd.offsetWidth) + "px";
        osd.style.top = Math.random() * (window.innerHeight - osd.offsetHeight) + "px";
        osd.style.opacity = osdOpacityNow();
    }, 3000);
}

// Shows the moving clock, and switches to video once the other app has released its decoder (#64)
function startClock() {
    clockMode = true;
    document.body.classList.add("clock");
    layoutOSD();
    moveClock();
    clockTimers.push(setInterval(moveClock, 60000));
    clockTimers.push(setInterval(function () {
        videoDecoderInUse().then(function (inUse) {
            if (!inUse && clockMode) stopClock();
        });
    }, 10000));
}

function stopClock() {
    clockMode = false;
    clockTimers.forEach(clearInterval);
    clockTimers = [];
    document.body.classList.remove("clock");
    osd.style.left = osd.style.top = "";
    layoutOSD();
    playRandomVideo();
}

function protGet(key, def) {
    var p = settings.protection;
    return (p && typeof p === "object" && p[key] !== undefined) ? p[key] : def;
}
function protNum(key, def) {
    var v = Number(protGet(key, def));
    return isNaN(v) ? def : v;
}
function setBacklight(v) {
    v = Math.max(0, Math.min(100, Math.round(v)));
    if (PROT.orig < 0 || v === PROT.last) return;
    PROT.last = v;
    luna("luna://com.webos.settingsservice/setSystemSettings",
        { category: "picture", settings: { backlight: v }, notifySelf: false });
}
function protRestore() {
    if (PROT.orig >= 0) setBacklight(PROT.orig);
}
// The brightness is changed only from the user's value that the watcher keeps (and puts back if this
// page is cut off): without a recent watcher, or without that value, it is left alone.
// corner hop: all the lines fade through filter, so it does not fight with the auto fade out (opacity)
function textFade(v, secs) {
    ["name", "poi", "time", "date"].forEach(function (id) {
        document.getElementById(id).style.filter = "opacity(" + v + ")";
    });
}
function protApplyCorner() {
    PTXT.pa = PTXT.corners[PTXT.idx];
    PTXT.ca = PTXT.pa.charAt(0) + (PTXT.pa.charAt(1) === "l" ? "r" : "l");   // opposite horizontally, like bl + br
    layoutOSD();
}
function protModeHas(m) { return PTXT.mode.split("+").indexOf(m) >= 0; }
function protGroupOn(i) { return !!protGet(i ? "fadeClockOn" : "fadeTextOn", true); }
function groupFade(i, v, secs) {
    (i ? ["time", "date"] : ["name", "poi"]).forEach(function (id) {
        var el = document.getElementById(id);
        el.style.setProperty("--od", secs + "s");
        el.style.opacity = v;
    });
}
function protTextStart() {
    var order = [["cornerTl", "tl"], ["cornerTr", "tr"], ["cornerBr", "br"], ["cornerBl", "bl"]], list = [], m = [], i;
    PTXT.mode = "";
    PTXT.g = [{ faded: false, age: 0, hid: 0 }, { faded: false, age: 0, hid: 0 }];
    if (protGet("cornersOn", false)) {
        for (i = 0; i < order.length; i++) if (protGet(order[i][0], true)) list.push(order[i][1]);
        if (list.length >= 2) {
            m.push("corners");
            PTXT.corners = list;
            i = list.indexOf(osdGet("placeAnchor"));
            PTXT.idx = i >= 0 ? i : 0;
            protApplyCorner();
        }
    }
    if (protGet("driftOn", false)) {
        m.push("drift");
        document.body.classList.add("drift");
    }
    if (protGet("fadeOn", false) && (protGroupOn(0) || protGroupOn(1))) m.push("fade");
    PTXT.mode = m.join("+");
}
// group i appears (if it was faded out) and its countdown starts again
function protShow(i) {
    var g = PTXT.g[i];
    g.age = g.hid = 0;
    if (g.faded) { g.faded = false; groupFade(i, 1, 1.5); }
}
// every second, for the name + description (0) and the clock + date (1) separately:
// shown for fadeAfter seconds, hidden, back after fadeTextBack / fadeClockBack minutes (0 = not on a timer)
function protFadeTick() {
    var i, g, back;
    for (i = 0; i < 2; i++) {
        g = PTXT.g[i];
        if (!protGroupOn(i)) continue;
        if (g.faded) {
            back = Math.round(protNum(i ? "fadeClockBack" : "fadeTextBack", i ? 5 : 0) * 60);
            g.hid++;
            if (back > 0 && g.hid >= back) protShow(i);
        } else if (++g.age >= Math.max(1, protNum("fadeAfter", 30))) {
            g.faded = true;
            g.hid = 0;
            groupFade(i, 0, 2.5);
        }
    }
}
// every second
function protTextTick() {
    var amp, ph;
    if (protModeHas("corners") && !clockMode && PROT.elapsed % Math.max(1, protNum("cornersEvery", 60)) === 0) {
        textFade(0, 1.5);
        setTimeout(function () {
            if (closing) return;
            PTXT.idx = (PTXT.idx + 1) % PTXT.corners.length;
            protApplyCorner();
            textFade(1, 1.5);
        }, 1500);
    }
    if (protModeHas("drift")) {
        amp = protNum("driftPx", 8);
        ph = 2 * Math.PI * PROT.elapsed / (Math.max(1, protNum("driftPeriod", 5)) * 60);
        // Lissajous curve 3:2 from the centre, closed once per driftPeriod (same in the app's preview)
        osd.style.transform = "translate(" + Math.round(amp * Math.sin(3 * ph)) + "px," + Math.round(amp * Math.sin(2 * ph)) + "px)";
    }
    if (protModeHas("fade") && !clockMode) protFadeTick();
}
// the description changed: its countdown starts again (and it appears, if it was faded out)
function protPoiChanged() {
    if (!protModeHas("fade")) return;
    PTXT.g[0].age = 0;
    if (PTXT.g[0].faded && protGet("fadeInPoi", true)) protShow(0);
}
// a new video: everything is back whatever the settings
function protOnPlaying() {
    if (!protModeHas("fade")) return;
    protShow(0);
    protShow(1);
}
function protStart() {
    protTextStart();
    var bright = protGet("brightnessOn", false), dim = protGet("dimOn", false);
    if (!(bright || dim) || watcherOrig === null) return;
    PROT.orig = PROT.last = watcherOrig;
    if (bright) {
        PROT.base = Math.max(0, Math.min(100, Math.round(protNum("brightness", 30))));
        setBacklight(PROT.base);
    } else {
        PROT.base = PROT.orig;
    }
}
// called every second
function protTick() {
    PROT.elapsed++;
    protTextTick();
    var min = PROT.elapsed / 60;
    // gradual dimming: from base down to dimTo % of it, over dimDuration minutes after dimAfter
    if (!PROT.panelOff && PROT.base >= 0 && protGet("dimOn", false)) {
        var after = protNum("dimAfter", 10), dur = Math.max(protNum("dimDuration", 5), 0.1);
        if (min >= after) {
            var f = Math.min((min - after) / dur, 1);
            setBacklight(PROT.base + (PROT.base * protNum("dimTo", 20) / 100 - PROT.base) * f);
        }
    }
    if (!PROT.panelOff && protGet("offOn", false) && min >= protNum("offAfter", 60)) protPanelOff();
    if (!PROT.standbyDone && protGet("standbyOn", false) && min >= protNum("standbyAfter", 120)) protStandby();
}
// The brightness is restored first: the panel is dark anyway, and it stays right even if the screensaver is cut off
function protPanelOff() {
    PROT.panelOff = true;
    protRestore();
    video.pause();
    luna("luna://com.webos.service.tvpower/power/turnOffScreen");
}
function protStandby() {
    PROT.standbyDone = true;
    protRestore();
    if (!STANDBY_METHOD) { console.log("protection: standby command is not set"); return; }
    luna("luna://com.webos.service.tvpower/power/" + STANDBY_METHOD, {reason: "remoteKey"});
}
function protDebug() {
    return "backlight " + PROT.last + " (was " + PROT.orig + (PROT.orig < 0 ? ", " + (watcherAlive ? "no value from the watcher" : "no watcher") : "") + "), " + Math.floor(PROT.elapsed / 60) + " min" +
        (PROT.panelOff ? ", panel off" : "") + (PROT.standbyDone ? ", standby sent" : "") + (PTXT.mode ? ", text: " + PTXT.mode : "");
}

function updateDebug() {
    if (!settings.debug) return;
    var el = document.getElementById("debug");
    el.style.display = "block";
    el.textContent = "Mode: " + (clockMode ? "clock (video decoder in use)" : "video") +
        "\n Video " + randomIndex + " of " + playList.assets.length + (nightPlaying ? " (night playlist)" : "") +
        (settings.solarMode ? "\n Solar: now " + solarNow + ", playing " + (solarPlaying || "other (fallback)") + " (" + solarSource + " times)" : "") +
        "\n Source Type: " + settings.sourceType + sourceAlt +
        "\n Try Other Source: " + settings.playLowerQuality +
        "\n Locale: " + settings.localeLang +
        "\n Protection: " + protDebug() +
        "\n OSD opacity: " + Math.round(osdOpacityNow() * 100) + "%" + (settings.osdOpacitySplit ? " (DV " + osdOpacityOf("dv") + " / SDR " + osdOpacityOf("sdr") + ")" : "") +
        "\n Timecode: " + Math.floor(video.currentTime) + " / " + Math.floor(video.duration || 0) +
        "\n Ready State: " + video.readyState +
        "\n Stalled Timeout: " + (25 - stalledSeconds) +
        "\n Error: " + (video.error ? video.error.code + " " + video.error.message : 0) +
        "\n Notifications: " + (notifyOff ? "off" : "on") + ", watcher " + (watcherAlive ? "running" : "not seen") +
        "\n Paused: " + video.paused;
}

// Any key ends the screensaver
// Closing at once can lose the enable, so close once it's answered (or after 0.5 s)
var closeSent = false; // not "closed": that's window.closed, read-only
function closeOnce() {
    if (closeSent) return;
    closeSent = true;
    window.close();
}
document.addEventListener("keydown", function () {
    if (closing) return;
    closing = true;
    protRestore();
    setTimeout(closeOnce, 500);
    setNotifications(true, false, closeOnce);
});
// Closed by the system (tvpowerd ending the screensaver): a call from here may not get out, which
// is why videoads-flag.sh also switches notifications on
window.addEventListener("pagehide", function () { setNotifications(true); protRestore(); });

loadJSONData(basePath + "settings.json")
    .then(function (s) { for (var key in s) settings[key] = s[key]; })
    .catch(function (e) { console.error(e.message); })
    .then(function () {
        return Promise.all([
            loadJSONData(basePath + "videos.json"),
            loadJSONData(basePath + "locales/" + settings.localeLang + ".json").catch(function () { return { strings: {} }; }),
            videoDecoderInUse(),
            checkWatcher(),
            loadSolar(),
            setManualMode()
        ]);
    })
    .then(function (r) {
        playList = r[0];
        buildDisabledSet();
        buildNightSet();
        poi = r[1];
        if (osdInvisible()) osd.style.display = "none";
        applyOsdFont();
        layoutOSD();
        updateOSD();
        protStart();
        setInterval(function () { checkStatus(); updateOSD(); updateDebug(); checkWatcher(); protTick(); }, 1000);
        if (r[2]) startClock(); else playRandomVideo();
    })
    .catch(function (e) {
        settings.debug = true;
        document.getElementById("debug").style.display = "block";
        document.getElementById("debug").textContent = e.message;
    });
</script>
</body>
</html>
